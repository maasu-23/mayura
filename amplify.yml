version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Vite 8 and TypeScript 6 need a modern Node. Amplify's default image
        # has lagged behind before, so pin it rather than inherit whatever the
        # build image ships with.
        - nvm install 22 && nvm use 22
        - node -v
        - npm ci
    build:
      commands:
        # Runs `tsc -b && vite build` — a type error fails the deploy, which is
        # the intent. There is no test suite to run.
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
