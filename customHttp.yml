customHeaders:
  # Vite fingerprints everything under /assets, so those files are safe to cache
  # forever — a new build produces a new filename.
  - pattern: '/assets/*'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'

  # Imagery is NOT fingerprinted (it is copied straight from public/), so it must
  # not be immutable or replacing a render would never reach returning visitors.
  # A week is a reasonable compromise for the mobile-data audience.
  - pattern: '/projects/*'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=604800'
  - pattern: '/hero/*'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=604800'
  - pattern: '/cta/*'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=604800'

  # The entry point must always be revalidated, or a deploy will not be picked up.
  - pattern: '/index.html'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=0, must-revalidate'
